<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contrasena - Stylo Barber Connect</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body style="background: var(--color-primary-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center;">

  <div class="container" style="max-width: 420px;">
    <div class="card" style="padding: var(--spacing-xl);">
      <div class="text-center mb-lg">
        <a href="01-inicio.html" class="navbar-logo" style="font-size: 28px;">Stylo <span>Barber</span></a>
        <h2 class="mt-lg mb-sm">Recuperar contrasena</h2>
        <p class="text-small">Ingresa tu correo y te enviaremos instrucciones para restablecer tu contrasena.</p>
      </div>

      <form>
        <div class="form-group">
          <label class="form-label">Correo electronico</label>
          <input type="email" class="form-input" placeholder="correo@ejemplo.com">
        </div>

        <button type="submit" class="btn btn-primary btn-block mb-lg">Enviar instrucciones</button>

        <p class="text-center text-small">
          <a href="06-login.html" class="text-gold">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Volver al inicio de sesion
          </a>
        </p>
      </form>
    </div>

    <!-- Estado: Email enviado -->
    <div class="card mt-lg" style="padding: var(--spacing-xl); display: none;">
      <div class="text-center">
        <div class="stat-card-icon" style="margin: 0 auto var(--spacing-md); background: var(--color-success-light);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
        </div>
        <h3 class="mb-sm">Correo enviado!</h3>
        <p class="text-small mb-lg">Revisa tu bandeja de entrada y sigue las instrucciones para restablecer tu contrasena.</p>
        <a href="06-login.html" class="btn btn-primary">Volver al login</a>
      </div>
    </div>
  </div>

</body>
</html>
